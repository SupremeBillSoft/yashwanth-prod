services:
  yshapi:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: yashwanth_api
    env_file: ./api/.env
    volumes:
      - ./api:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    networks:
      - web
    restart: always

  # Dedicated stage to build React dist assets
  frontend-builder:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: yashwanth-frontend:latest
    container_name: yashwanth_frontend_builder
    volumes:
      - client_dist:/app/dist

  nginx:
    image: nginx:alpine
    container_name: yashwanth_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - client_dist:/usr/share/nginx/html:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - web
    depends_on:
      - yshapi
      - frontend-builder
    restart: always

volumes:
  static_volume:
  media_volume:
  client_dist:

networks:
  web:
    external: true