server {
    listen 80;
    server_name yashwanthpaints.com api.yashwanthpaints.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main site: React UI
server {
    listen 443 ssl;
    server_name yashwanthpaints.com;

    ssl_certificate     /etc/letsencrypt/live/yashwanthpaints.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yashwanthpaints.com/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /api/ {
        proxy_pass http://yshapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API site: everything goes to Django
